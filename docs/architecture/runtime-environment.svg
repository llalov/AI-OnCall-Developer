<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>How Aspire, Docker and eShop connect</title>
  <desc>The Aspire AppHost starts the eShop .NET services as processes and the infrastructure as Docker containers; the services use the containers; everything sends telemetry to the Aspire dashboard.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t  { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .s  { font-size: 12px; text-anchor: middle; dominant-baseline: central; }
      .a  { stroke: #B4B2A9; stroke-width: 1.5; fill: none; }
      .d  { stroke-dasharray: 4 3; }
      .gray rect   { fill: #444441; stroke: #888780; }
      .gray .t     { fill: #F1EFE8; }
      .gray .s     { fill: #D3D1C7; }
      .teal rect   { fill: #085041; stroke: #1D9E75; }
      .teal .t     { fill: #E1F5EE; }
      .purple rect { fill: #3C3489; stroke: #7F77DD; }
      .purple .t   { fill: #EEEDFE; }
      .purple .s   { fill: #CECBF6; }
      .legend      { font-size: 11px; fill: #B4B2A9; }
    </style>
  </defs>

  <rect x="0" y="0" width="680" height="500" rx="12" fill="#1F1F1E"/>

  <g class="purple"><rect x="240" y="30" width="200" height="56" rx="8"/><text class="t" x="340" y="48">Aspire AppHost</text><text class="s" x="340" y="68">Starts and wires it all</text></g>
  <line class="a" x1="280" y1="86" x2="280" y2="128" marker-end="url(#arrow)"/>
  <line class="a" x1="400" y1="86" x2="400" y2="128" marker-end="url(#arrow)"/>

  <g class="teal"><rect x="40" y="130" width="290" height="250" rx="20"/><text class="t" x="185" y="150">eShop .NET services</text></g>
  <g class="teal"><rect x="60" y="170" width="250" height="40" rx="8"/><text class="t" x="185" y="190">webapp (the shop)</text></g>
  <g class="teal"><rect x="60" y="220" width="250" height="40" rx="8"/><text class="t" x="185" y="240">catalog-api</text></g>
  <g class="teal"><rect x="60" y="270" width="250" height="40" rx="8"/><text class="t" x="185" y="290">basket-api</text></g>
  <g class="teal"><rect x="60" y="320" width="250" height="40" rx="8"/><text class="t" x="185" y="340">ordering-api + workers</text></g>

  <line class="a" x1="330" y1="255" x2="348" y2="255" marker-end="url(#arrow)"/>

  <g class="gray"><rect x="350" y="130" width="290" height="250" rx="20"/><text class="t" x="495" y="150">Docker containers</text></g>
  <g class="gray"><rect x="370" y="170" width="250" height="56" rx="8"/><text class="t" x="495" y="188">PostgreSQL</text><text class="s" x="495" y="208">Orders, catalog</text></g>
  <g class="gray"><rect x="370" y="240" width="250" height="56" rx="8"/><text class="t" x="495" y="258">Redis</text><text class="s" x="495" y="278">Baskets</text></g>
  <g class="gray"><rect x="370" y="310" width="250" height="56" rx="8"/><text class="t" x="495" y="328">RabbitMQ</text><text class="s" x="495" y="348">Events between services</text></g>

  <line class="a d" x1="280" y1="380" x2="280" y2="418" marker-end="url(#arrow)"/>
  <line class="a d" x1="400" y1="380" x2="400" y2="418" marker-end="url(#arrow)"/>

  <g class="purple"><rect x="240" y="420" width="200" height="56" rx="8"/><text class="t" x="340" y="438">Aspire dashboard</text><text class="s" x="340" y="458">Logs, traces, metrics</text></g>

  <line class="a d" x1="490" y1="448" x2="520" y2="448"/>
  <text class="legend" x="528" y="448" dominant-baseline="central">telemetry (OTLP)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
