<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 476" width="680" height="476" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>AI on-call agent architecture</title>
  <desc>Chaos scripts break eShop on Aspire; its telemetry is exposed through MCP servers; the agent loop uses an LLM API, calls tools through a security layer, and asks a human on call for approval.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t  { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .s  { font-size: 12px; text-anchor: middle; dominant-baseline: central; }
      .a  { stroke: #B4B2A9; stroke-width: 1.5; fill: none; }
      .gray rect   { fill: #444441; stroke: #888780; }
      .gray .t     { fill: #F1EFE8; }
      .gray .s     { fill: #D3D1C7; }
      .teal rect   { fill: #085041; stroke: #1D9E75; }
      .teal .t     { fill: #E1F5EE; }
      .teal .s     { fill: #9FE1CB; }
      .purple rect { fill: #3C3489; stroke: #7F77DD; }
      .purple .t   { fill: #EEEDFE; }
      .purple .s   { fill: #CECBF6; }
    </style>
  </defs>

  <rect x="0" y="0" width="680" height="476" rx="12" fill="#1F1F1E"/>

  <g class="gray"><rect x="90" y="30" width="200" height="56" rx="8"/><text class="t" x="190" y="48">Chaos scripts</text><text class="s" x="190" y="68">Break things on purpose</text></g>
  <line class="a" x1="290" y1="58" x2="386" y2="58" marker-end="url(#arrow)"/>
  <g class="gray"><rect x="390" y="30" width="200" height="56" rx="8"/><text class="t" x="490" y="48">eShop on Aspire</text><text class="s" x="490" y="68">Patient + telemetry</text></g>
  <line class="a" x1="490" y1="86" x2="490" y2="123" marker-end="url(#arrow)"/>

  <g class="teal"><rect x="40" y="125" width="600" height="115" rx="20"/><text class="t" x="340" y="145">MCP servers (your tools)</text></g>
  <g class="teal"><rect x="60" y="165" width="125" height="56" rx="8"/><text class="t" x="122" y="183">Logs, metrics</text><text class="s" x="122" y="203">Read-only</text></g>
  <g class="teal"><rect x="205" y="165" width="125" height="56" rx="8"/><text class="t" x="267" y="183">Deploy history</text><text class="s" x="267" y="203">Read-only</text></g>
  <g class="teal"><rect x="350" y="165" width="125" height="56" rx="8"/><text class="t" x="412" y="183">Runbooks</text><text class="s" x="412" y="203">RAG search</text></g>
  <g class="teal"><rect x="495" y="165" width="125" height="56" rx="8"/><text class="t" x="557" y="183">Rollback</text><text class="s" x="557" y="203">Needs approval</text></g>

  <g class="gray"><rect x="60" y="280" width="170" height="56" rx="8"/><text class="t" x="145" y="298">LLM API</text><text class="s" x="145" y="318">Claude or GPT</text></g>
  <line class="a" x1="253" y1="308" x2="234" y2="308" marker-end="url(#arrow)"/>
  <g class="purple"><rect x="255" y="280" width="170" height="56" rx="8"/><text class="t" x="340" y="298">Agent loop</text><text class="s" x="340" y="318">Investigate, decide</text></g>
  <line class="a" x1="425" y1="308" x2="446" y2="308" marker-end="url(#arrow)"/>
  <g class="purple"><rect x="450" y="280" width="170" height="56" rx="8"/><text class="t" x="535" y="298">Security layer</text><text class="s" x="535" y="318">Mask, limit, check</text></g>
  <line class="a" x1="535" y1="280" x2="535" y2="244" marker-end="url(#arrow)"/>

  <line class="a" x1="340" y1="336" x2="340" y2="378" marker-end="url(#arrow)"/>
  <g class="gray"><rect x="240" y="380" width="200" height="56" rx="8"/><text class="t" x="340" y="398">Human on call</text><text class="s" x="340" y="418">Approves in Teams/Slack</text></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
